name: Lighthouse

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      run: npm install && npm install -g @lhci/cli@0.14.x
      shell: bash
    - name: Build project
      run: npm run build
      shell: bash
    - name: Run Lighthouse CI
      run: lhci autorun
      shell: bash
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
