name: Lighthouse
description: Run Lighthouse to monitor performance and accessibility

inputs:
  LHCI_GITHUB_APP_TOKEN:
    description: "LHCI GitHub App Token"
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v6
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      run: npm install
      shell: bash
    - name: Install LHCI
      run: npm install -g @lhci/cli@0.14.x
      shell: bash
    - name: Install serve
      run: npm install -g serve
      shell: bash
    - name: Build project
      run: npm run build
      shell: bash
    - name: Run Lighthouse CI
      run: lhci autorun
      shell: bash
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ inputs.LHCI_GITHUB_APP_TOKEN }}
