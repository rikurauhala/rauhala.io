name: Linting
description: Enforce code style and quality using ESLint

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      run: npm ci
      shell: bash
    - name: Lint code
      run: npm run lint
      shell: bash
