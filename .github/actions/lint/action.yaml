name: Linting
description: Enforce code style and quality using Biome

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Install dependencies
      run: npm ci
      shell: bash
    - name: Lint code
      run: npm run lint:ci
      shell: bash
